name: Bug report
description: Report a problem with dsh-devtools
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a minimal project that shows the issue.
      placeholder: |
        1. Install dsh-devtools
        2. Open a session
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: dsh-devtools and DeepSeek Harness versions.
      placeholder: "dsh-devtools 0.1.0, DeepSeek Harness v0.1.0-rc.6"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output, screenshots, or error messages.
      render: shell
